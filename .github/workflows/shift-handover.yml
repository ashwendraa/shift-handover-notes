name: Shift Handover Bot

on:
  # Manual trigger, for your dry runs and limited-ID tests
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not actually post notes)"
        type: boolean
        default: true
      limit_ids:
        description: "Comma separated conversation IDs to restrict to (leave blank for all)"
        type: string
        default: ""
      force:
        description: "Force post even if unchanged since last recorded run (use this to recover from a bad state file, or to re-test)"
        type: boolean
        default: false

  # Scheduled runs. GitHub Actions cron always runs in UTC. Target
  # shift-start times are IST (UTC+5:30): Mon-Fri 5 AM, 2 PM, 6 PM,
  # 8 PM, and Sat 5 AM. Each run is set to fire 15 minutes BEFORE the
  # actual shift time, so the incoming shift already has a fresh note
  # waiting when they log in.
  schedule:
    # Mon-Fri 4:45 AM IST (15 min before 5 AM) -> Sun 11:15 PM through Thu 11:15 PM UTC
    - cron: "15 23 * * 0-4"
    # Mon-Fri 1:45 PM IST (15 min before 2 PM) -> Mon-Fri 8:15 AM UTC
    - cron: "15 8 * * 1-5"
    # Mon-Fri 5:45 PM IST (15 min before 6 PM) -> Mon-Fri 12:15 PM UTC
    - cron: "15 12 * * 1-5"
    # Mon-Fri 7:45 PM IST (15 min before 8 PM) -> Mon-Fri 2:15 PM UTC
    - cron: "15 14 * * 1-5"
    # Sat 4:45 AM IST (15 min before 5 AM) -> Fri 11:15 PM UTC
    - cron: "15 23 * * 5"

jobs:
  run-handover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore state file cache
        uses: actions/cache@v4
        with:
          path: shift_handover_state.json
          # A key that never changes on its own means the cache is
          # restored every run and saved again every run, giving you
          # a persistent state file across scheduled runs.
          key: shift-handover-state

      - name: Run shift handover script (scheduled, live)
        if: github.event_name == 'schedule'
        env:
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          INTERCOM_ADMIN_ID: ${{ secrets.INTERCOM_ADMIN_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 shift_handover.py

      - name: Run shift handover script (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          INTERCOM_ADMIN_ID: ${{ secrets.INTERCOM_ADMIN_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.limit_ids }}" ]; then
            ARGS="$ARGS --limit-ids ${{ inputs.limit_ids }}"
          fi
          python3 shift_handover.py $ARGS

      - name: Upload run log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-handover-log-${{ github.run_id }}
          path: shift_handover_log.csv
          if-no-files-found: ignore
